# ASCII only. See alembic/env.py for the reasoning in Russian.
#
# Why: configparser reads this file with the platform default encoding.
# On Windows that is cp1251, and any Cyrillic here makes `alembic` and every
# migration test die with UnicodeDecodeError. Comments in Russian belong in
# env.py, which Python always reads as UTF-8.
#
# The database URL is intentionally absent: it comes from the environment
# via alembic/env.py, so a password never lands in a file tracked by git.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = Europe/Moscow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

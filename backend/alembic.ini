# Миграции. URL здесь намеренно не задан: он приходит из окружения через
# alembic/env.py, чтобы строка подключения с паролем не лежала в файле,
# который попадает в git.

[alembic]
script_location = alembic
prepend_sys_path = src
# Имя ревизии начинается с даты: разбирать историю по хешам неудобно.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = Europe/Moscow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

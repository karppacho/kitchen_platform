# Оверлей поверх официального compose Supabase.
#
# Проверено на боевом сервере 09.09.2026 против supabase/docker актуальной
# на тот день ревизии: Postgres 17.6, шлюз — Envoy (`api-gw`), не Kong.
#
# Держим шесть сервисов из одиннадцати. Выключенное — не «пусть повисит на
# всякий случай», а осознанный отказ:
#
#   rest (PostgREST)  API у нас на FastAPI. Два слоя доступа с разными
#                     правилами дают вопрос «где чинить», см. docs/adr/0002.
#   realtime          не используется.
#   storage+imgproxy  фото лежат на Google Drive: ссылки на них уже стоят
#                     в таблице шефа.
#   functions         не используется.
#
# Ни один сервис из оставленных не зависит от выключенных, поэтому правок
# depends_on не требуется.
#
# ВАЖНО, два места, на которых легко обжечься:
#
#   1. В `.env` Supabase по умолчанию стоит `COMPOSE_FILE=docker-compose.yml`.
#      Пока там одно имя, этот файл **молча игнорируется**: compose
#      подхватывает docker-compose.override.yml автоматически только когда
#      COMPOSE_FILE не задан. Обязательно:
#          COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml
#
#   2. Порты нельзя ограничить через переменные окружения. `POSTGRES_PORT`
#      уходит внутрь контейнера как `PGPORT` и в строки подключения, так что
#      `POSTGRES_PORT=127.0.0.1:5432` роняет базу с
#      `invalid value for parameter "port"`. Привязка делается только здесь.

services:
  # db портов не публикует намеренно: доступ к Postgres идёт через пулер.
  # 5432 у supavisor — session mode (им ходит Alembic: миграции держат одну
  # сессию от начала до конца), 6543 — transaction mode (им ходит приложение).
  #
  # Имя пользователя при подключении через пулер обязано нести идентификатор
  # арендатора — `postgres.<POOLER_TENANT_ID>`. Без суффикса Supavisor
  # отвечает `ENOIDENTIFIER: no tenant identifier provided`.
  supavisor:
    # !override, а не просто `ports`: списки портов при слиянии
    # ДОПИСЫВАЮТСЯ. Без тега рядом с нашей привязкой осталась бы исходная
    # 0.0.0.0 — то есть Postgres в интернете.
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"

  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000"

  # studio портов не публикует и в базовом файле — он доступен через api-gw,
  # а снаружи только по SSH-туннелю. За ним полный доступ к базе, а защита —
  # одна пара логин/пароль.

  rest:
    profiles: ["unused"]

  realtime:
    profiles: ["unused"]

  storage:
    profiles: ["unused"]

  imgproxy:
    profiles: ["unused"]

  functions:
    profiles: ["unused"]

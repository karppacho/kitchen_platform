# Оверлей поверх официального compose Supabase.
#
# Делает две вещи, обе обязательные:
#
#   1. Загоняет ВСЕ публикуемые порты на 127.0.0.1. В официальном файле
#      Postgres и Kong публикуются на все интерфейсы; на машине с белым
#      адресом их начинают сканировать в течение часов.
#
#   2. Выключает то, чем мы не пользуемся. Решение не использовать PostgREST
#      и RLS принято в docs/adr/0002: API у нас на FastAPI, два слоя доступа
#      с разными правилами — источник вопроса «где чинить». Всё выключенное
#      это ещё и память, которой на сервере в обрез: там уже живут три бота
#      и Chrome для скрапинга конкурентов.
#
# Применение — см. README.md рядом.

services:
  # =========================================================================
  # Оставляем. Только перепривязка портов.
  # =========================================================================
  db:
    ports:
      - "127.0.0.1:5432:5432"

  supavisor:
    ports:
      # 6543 — transaction mode, через него ходит приложение.
      - "127.0.0.1:6543:6543"
      # 5433 — session mode. Нужен там, где transaction mode не подходит:
      # подготовленные выражения, advisory-локи, LISTEN/NOTIFY.
      - "127.0.0.1:5433:5433"

  kong:
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
    # В базовом файле Kong ждёт analytics, а мы его выключаем. Список
    # depends_on при слиянии заменяется целиком, а не дополняется.
    depends_on:
      db:
        condition: service_healthy

  auth:
    depends_on:
      db:
        condition: service_healthy

  meta:
    depends_on:
      db:
        condition: service_healthy

  studio:
    # За Studio стоит полный доступ к базе, а защита — одна пара
    # логин/пароль в Kong. Наружу не публикуется никогда: доступ только
    # через SSH-туннель, см. README.
    ports: []
    depends_on:
      db:
        condition: service_healthy

  # =========================================================================
  # Выключаем. Профиль, который никогда не активируется, — штатный способ
  # не поднимать сервис, не редактируя базовый файл.
  # =========================================================================
  rest:
    profiles: ["unused"]

  realtime:
    profiles: ["unused"]

  storage:
    profiles: ["unused"]

  imgproxy:
    profiles: ["unused"]

  functions:
    profiles: ["unused"]

  analytics:
    profiles: ["unused"]

  vector:
    profiles: ["unused"]

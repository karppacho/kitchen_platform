# Единственная точка входа снаружи. Всё остальное слушает 127.0.0.1.
#
# Домен подставляется при развёртывании: замените kitchen.example.ru.

# Зоны ограничения частоты. Объявляются на уровне http — conf.d
# подключается именно туда, поэтому место здесь.
#
# Вход: защита от подбора пароля. Пользователей двое, лимит может быть жёстким.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Обращения к модели: защита не только от перебора, но и от разорения —
# каждый вызов polza.ai стоит денег.
limit_req_zone $binary_remote_addr zone=llm:10m rate=30r/m;

# HTTP нужен только под обновление сертификата и редирект.
server {
    listen 80;
    listen [::]:80;
    server_name kitchen.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kitchen.example.ru;

    ssl_certificate     /etc/letsencrypt/live/kitchen.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchen.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Год и с поддоменами. Включать осознанно: откатить HSTS у уже
    # побывавших посетителей нельзя — браузер запомнил.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Приложение своё, внешних скриптов не тянет.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https://drive.google.com https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Версию nginx наружу не сообщаем.
    server_tokens off;

    # Фото этикеток приходят с телефона.
    client_max_body_size 25m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Потоковый вывод LLM-чата не должен буферизоваться: иначе ответ
        # приедет целиком в конце, и весь смысл потока пропадёт.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Ограничения вешаются на конкретные пути, а не на весь сервер:
    # лимит на вход не должен резать обычную работу со справочником.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/chat/ {
        limit_req zone=llm burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Проверка живости наружу не нужна: её вызывает деплой изнутри, по
    # 127.0.0.1. Снаружи она только сообщает версию тому, кто спросил.
    location /healthz {
        return 404;
    }
}

# Единственная точка входа снаружи. Всё остальное слушает 127.0.0.1.
#
# Домен подставляется при развёртывании: замените art.karppacho.ru.

# Зоны ограничения частоты. Объявляются на уровне http — conf.d
# подключается именно туда, поэтому место здесь.
#
# Вход: защита от подбора пароля. Пользователей двое, лимит может быть жёстким.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Обращения к модели: защита не только от перебора, но и от разорения —
# каждый вызов polza.ai стоит денег.
limit_req_zone $binary_remote_addr zone=llm:10m rate=30r/m;

# Политика кэша статики фронтенда. map — тоже на уровне http, по той же
# причине, что и limit_req_zone выше: conf.d подключается именно туда.
#
# Дописать Cache-Control через add_header прямо в location /assets/ или
# location = /index.html нельзя: add_header внутри location ОТМЕНЯЕТ все
# заголовки, унаследованные от server, — вместе с HSTS и CSP. Поэтому
# значение вычисляется здесь по $uri, а сам add_header ставится один раз
# на уровне server (см. ниже) и достаётся всем location разом.
#
# Пустая строка в map — особый случай: add_header с пустым значением
# заголовок вообще не выдаёт, так что ответы API сохраняют свой
# Cache-Control (или его отсутствие) нетронутым.
map $uri $kesh {
    ~^/assets/   "public, max-age=31536000, immutable";
    /index.html  "no-cache";
    default      "";
}

# HTTP нужен только под обновление сертификата и редирект.
server {
    listen 80;
    listen [::]:80;
    server_name art.karppacho.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name art.karppacho.ru;

    ssl_certificate     /etc/letsencrypt/live/art.karppacho.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art.karppacho.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Год и с поддоменами. Включать осознанно: откатить HSTS у уже
    # побывавших посетителей нельзя — браузер запомнил.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Приложение своё, внешних скриптов не тянет.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https://drive.google.com https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Значение — из map $kesh выше по файлу. Один add_header на уровне
    # server, действует на все location без риска потерять заголовки
    # безопасности в location с кэшируемым путём.
    #
    # Без `always`, в отличие от заголовков безопасности выше: тогда nginx
    # ставит его только на 2xx и 3xx. С `always` «immutable на год» уходил
    # бы и на 404 отсутствующего ассета, и после отката на сборку с прежними
    # хешами закэшированный на год 404 ломал бы страницу у шефа — со
    # стороны сервера такое не починить.
    add_header Cache-Control $kesh;

    # Версию nginx наружу не сообщаем.
    server_tokens off;

    # Фото этикеток приходят с телефона.
    client_max_body_size 25m;

    # Статика фронтенда лежит в образе.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Хешированные имена файлов меняются при каждой сборке, поэтому их
    # можно кэшировать надолго. Сам Cache-Control — через map $kesh и
    # add_header на уровне server выше; здесь его дописывать нельзя (см.
    # комментарий у map).
    location /assets/ {
        access_log off;
    }

    # index.html кэшировать нельзя: иначе после выкладки браузер неделю
    # показывает старую версию, и шеф не понимает, почему ничего не
    # изменилось. Сюда попадают и прямой запрос /index.html, и внутренний
    # редирект SPA-фолбэка (try_files $uri /index.html из location /) —
    # map $kesh срабатывает по итоговому $uri в обоих случаях.
    location = /index.html { }

    # /api без завершающего слэша не должен провалиться в SPA-фолбэк:
    # без этой строки location / отдал бы на такой запрос index.html с
    # кодом 200 вместо честного 404.
    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_buffering off здесь не нужен: под этим префиксом только
        # обычные JSON-ответы. Потоковый вывод — отдельно, в
        # location /api/chat/, и там своя, более узкая настройка.
        proxy_read_timeout 300s;
    }

    # Ограничения вешаются на конкретные пути, а не на весь сервер:
    # лимит на вход не должен резать обычную работу со справочником.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/chat/ {
        limit_req zone=llm burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Проверка живости наружу не нужна: её вызывает деплой изнутри, по
    # 127.0.0.1. Снаружи она только сообщает версию тому, кто спросил.
    location /healthz {
        return 404;
    }
}
